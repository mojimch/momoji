services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-momoji_db}
      DB_USER: ${DB_USER:-momoji}
      DB_PASS: ${DB_PASS:?Set DB_PASS in your local .env file}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/uploads

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-momoji_db}
      MYSQL_USER: ${DB_USER:-momoji}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in your local .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local .env file}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/momoji.sql:/docker-entrypoint-initdb.d/001-momoji.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --host=127.0.0.1 --user=root --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql-data:
  uploads:
